<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gorod Krovi Bomb Step Helper</title>
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #1a1d24;
      --accent-color: #e53935;
      --accent-glow: rgba(229, 57, 53, 0.4);
      --text-main: #f0f2f5;
      --text-sub: #9aa0a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    /* Active Sequence Display Box */
    .sequence-container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border: 2px solid #333;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.25rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .sequence-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-sub);
      margin-bottom: 0.5rem;
    }

    .sequence-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      min-height: 48px;
      align-items: center;
    }

    .seq-item {
      background: var(--accent-color);
      color: white;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      animation: popIn 0.15s ease-out;
    }

    .seq-num {
      background: rgba(0, 0, 0, 0.3);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .empty-msg {
      color: var(--text-sub);
      font-style: italic;
      font-size: 0.9rem;
    }

    /* Grid Layout for Map Locations */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.85rem;
      width: 100%;
      max-width: 650px;
      margin-bottom: 1.25rem;
    }

    @media (min-width: 550px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .location-btn {
      background: var(--card-bg);
      border: 2px solid #2d323e;
      border-radius: 10px;
      overflow: hidden;
      color: var(--text-main);
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0.5rem 0.75rem 0.5rem;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .location-btn:active {
      transform: scale(0.97);
    }

    .location-btn.selected {
      border-color: var(--accent-color);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .icon-container {
      width: 48px;
      height: 48px;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-color);
    }

    .icon-container svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .location-title {
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
    }

    .badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--accent-color);
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      z-index: 2;
    }

    /* Control Buttons */
    .controls {
      display: flex;
      gap: 1rem;
      width: 100%;
      max-width: 650px;
    }

    .control-btn {
      flex: 1;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .control-btn:active {
      opacity: 0.8;
    }

    .btn-undo {
      background: #374151;
      color: var(--text-main);
    }

    .btn-reset {
      background: var(--accent-color);
      color: white;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Gorod Krovi</h1>
    <p class="subtitle">Bomb Step Helper</p>
  </header>

  <div class="sequence-container">
    <div class="sequence-title">Active Bomb Defusal Order</div>
    <div class="sequence-list" id="sequenceList">
      <span class="empty-msg">Tap locations in the order SOPHIA names them</span>
    </div>
  </div>

  <div class="grid">
    <div class="location-btn" onclick="selectLocation('Dragon Command')" data-name="Dragon Command">
      <div class="img-container">
        <img src="https://i.imgur.com/vHq10OQ.jpg" alt="Dragon Command">
      </div>
      <div class="location-title">Dragon Command</div>
    </div>

    <div class="location-btn" onclick="selectLocation('Armory')" data-name="Armory">
      <div class="img-container">
        <img src="https://i.imgur.com/rN3863a.jpg" alt="Armory">
      </div>
      <div class="location-title">Armory</div>
    </div>

    <div class="location-btn" onclick="selectLocation('Department Store')" data-name="Department Store">
      <div class="img-container">
        <img src="https://i.imgur.com/7j4ZJ3m.jpg" alt="Department Store">
      </div>
      <div class="location-title">Department Store</div>
    </div>

    <div class="location-btn" onclick="selectLocation('Supply Depot')" data-name="Supply Depot">
      <div class="img-container">
        <img src="https://i.imgur.com/S6M67GZ.jpg" alt="Supply Depot">
      </div>
      <div class="location-title">Supply Depot</div>
    </div>

    <div class="location-btn" onclick="selectLocation('Infirmary')" data-name="Infirmary">
      <div class="img-container">
        <img src="https://i.imgur.com/9C8A0yU.jpg" alt="Infirmary">
      </div>
      <div class="location-title">Infirmary</div>
    </div>

    <div class="location-btn" onclick="selectLocation('Hatchery')" data-name="Hatchery">
      <div class="img-container">
        <img src="https://i.imgur.com/E4p49aW.jpg" alt="Hatchery">
      </div>
      <div class="location-title">Hatchery</div>
    </div>
  </div>
  <div class="controls">
    <button class="control-btn btn-undo" onclick="undoLast()">Undo Last</button>
    <button class="control-btn btn-reset" onclick="resetAll()">Reset All</button>
  </div>

  <script>
    let sequence = [];

    function selectLocation(name) {
      if (sequence.length >= 6) return;
      if (sequence.includes(name)) return;

      sequence.push(name);
      updateUI();
    }

    function undoLast() {
      sequence.pop();
      updateUI();
    }

    function resetAll() {
      sequence = [];
      updateUI();
    }

    function updateUI() {
      const listEl = document.getElementById('sequenceList');
      const buttons = document.querySelectorAll('.location-btn');

      buttons.forEach(btn => {
        btn.classList.remove('selected');
        const badge = btn.querySelector('.badge');
        if (badge) badge.remove();
      });

      sequence.forEach((name, index) => {
        buttons.forEach(btn => {
          if (btn.getAttribute('data-name') === name) {
            btn.classList.add('selected');
            const badge = document.createElement('div');
            badge.className = 'badge';
            badge.innerText = index + 1;
            btn.appendChild(badge);
          }
        });
      });

      if (sequence.length === 0) {
        listEl.innerHTML = '<span class="empty-msg">Tap locations in the order SOPHIA names them</span>';
      } else {
        listEl.innerHTML = sequence.map((name, idx) => `
          <div class="seq-item">
            <span class="seq-num">${idx + 1}</span>
            <span>${name}</span>
          </div>
        `).join('');
      }
    }
  </script>

</body>
</html>
